name: Esteira DevSecOps - Core Box

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # ETAPA 1 - SECRET SCANNING
  # =========================================================
  gitleaks:
    name: "1 - Secret Scanning - Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true


  # =========================================================
  # ETAPA 2 - SAST
  # =========================================================
  semgrep:
    name: "2 - SAST - Semgrep"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Executar TM-03
        run: semgrep --config .semgrep/tm03.yml app/
        continue-on-error: true

      - name: Executar TM-04
        run: semgrep --config .semgrep/tm04.yml app/
        continue-on-error: true

      - name: Executar TM-06
        run: semgrep --config .semgrep/tm06.yml app/
        continue-on-error: true


  # =========================================================
  # ETAPA 3 - TESTES FUNCIONAIS E ABUSE CASES
  # =========================================================
  testes:
    name: "3 - Testes Funcionais e Abuse Cases"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Executar pytest
        run: python -m pytest -v


  # =========================================================
  # ETAPA 4 - SCA / DEPENDENCIAS
  # =========================================================
  trivy-fs:
    name: "4 - SCA - Trivy FS"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Executar Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"


  # =========================================================
  # ETAPA 5 - DOCKER BUILD
  # =========================================================
  docker-build:
    name: "5 - Docker Build"
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - testes
      - trivy-fs

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t core-box:ci .

      - name: Salvar imagem Docker
        run: docker save core-box:ci -o core-box.tar

      - name: Publicar imagem como artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-box-image
          path: core-box.tar
          retention-days: 1


  # =========================================================
  # ETAPA 6 - CONTAINER SCANNING
  # =========================================================
  trivy-image:
    name: "6 - Container Scan - Trivy Image"
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: core-box-image

      - name: Carregar imagem Docker
        run: docker load -i core-box.tar

      - name: Executar Trivy Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: core-box:ci
          severity: HIGH,CRITICAL
          exit-code: "0"


  # =========================================================
  # ETAPA 7 - DAST / OWASP ZAP
  # =========================================================
  zap:
    name: "7 - DAST - OWASP ZAP"
    runs-on: ubuntu-latest

    needs:
      - trivy-image

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Build da aplicacao
        run: docker compose build

      - name: Subir aplicacao
        run: docker compose up -d

      - name: Aguardar aplicacao
        run: |
          for i in {1..30}; do
            if curl --silent --show-error --fail http://localhost:8000/health; then
              echo "Aplicacao disponivel."
              exit 0
            fi

            echo "Tentativa $i de 30: aplicacao ainda indisponivel."
            sleep 2
          done

          echo "ERRO: aplicacao nao respondeu em ate 60 segundos."
          docker compose ps
          docker compose logs
          exit 1

      - name: Executar ZAP Baseline
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$(pwd):/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://localhost:8000 \
            -r zap-report.html

      - name: Publicar relatorio ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
          if-no-files-found: warn

      - name: Encerrar aplicacao
        if: always()
        run: docker compose down
